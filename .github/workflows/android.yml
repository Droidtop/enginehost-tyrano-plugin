name: Build Enginehost bundle

on:
  push:
    branches: ["plugin/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release on the chosen channel. Stable is
          for a bundle that has been used with real games on hardware; testing
          for one that runs games but has not been lived with. Every push
          already publishes to the unstable channel by itself.
        type: boolean
        default: false
      channel:
        description: "Release channel for a promoted build"
        type: choice
        options: [stable, testing]
        default: stable
      tag:
        description: "Release tag (default: derived from the bundle id; testing adds -testing)"
        type: string
        default: ""
permissions:
  contents: read

# One push supersedes the previous one instead of racing it. Keyed on the
# ref, so branches and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    # Builds and packs the payload. No signing key and no write token here:
    # Gradle, its plugins and the third-party actions below run in this job
    # (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      # 2026-09-16: setup-android's default package list still asks for the
      # obsolete "tools" SDK package, which Google has withdrawn from the
      # repository, so sdkmanager exits 1 and the job dies before Gradle runs.
      # The runner image already ships platform-tools and the command-line
      # tools; an empty list makes the action only put them on PATH.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      # The plugin API this core compiles against: Enginehost's own, at the commit pinned here.
      - uses: Droidtop/enginehost/.github/actions/plugin-api@330c8795bd6971fc4f5e3ad973476dd4722d56b6
      # The PC-build shim (PcBuildShim) run in Node against a mock of plugin-web's storage: what a
      # Tyrano game's file saves rely on, and that nothing leaves the save-folder store.
      - name: PC-build shim test
        run: |
          set -euo pipefail
          mkdir -p build/shim
          javac -d build/shim app/src/main/java/dev/enginehost/plugin/tyrano/PcBuildShim.java tools/shim-test/PrintShim.java
          java -cp build/shim dev.enginehost.plugin.tyrano.PrintShim > build/shim/shim.js
          node tools/shim-test/test_shim.js build/shim/shim.js
      - name: Build the runtime library
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Pack the unsigned bundle inputs
        run: |
          set -euo pipefail
          mkdir -p build/unsigned/payload
          unzip -p app/build/outputs/aar/app-release.aar classes.jar > build/classes.jar
          "$ANDROID_HOME/build-tools/36.0.0/d8" --release --min-api 26 --output build/unsigned/payload build/classes.jar
          cp LICENSE build/unsigned/payload/LICENSE
          cp enginehost/bundle-metadata.json build/unsigned/bundle-metadata.json
          # A tar keeps the file modes the manifest signs; an artifact would not.
          tar -cf build/unsigned.tar -C build/unsigned payload bundle-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enginehost-tyrano-v1-unsigned
          path: build/unsigned.tar
          if-no-files-found: error

  sign:
    # Enginehost's one signing mechanism, pinned by commit: the key never
    # shares a runner with the build.
    needs: bundle
    permissions:
      contents: read
    uses: Droidtop/enginehost/.github/workflows/sign-engine-bundle.yml@bed4f8c3a300c5f8bc55dd4bd184e38ab9c7beda
    with:
      tooling-sha: bed4f8c3a300c5f8bc55dd4bd184e38ab9c7beda
      unsigned-artifact: enginehost-tyrano-v1-unsigned
      bundle: dev.enginehost.tyrano.v1.enginehost.tar.xz
      artifact-name: enginehost-tyrano-v1
    secrets:
      ENGINEHOST_CERTIFICATE_KEY_PEM: ${{ secrets.ENGINEHOST_CERTIFICATE_KEY_PEM }}

  publish:
    # Promotion is deliberate: a manual dispatch names the channel. Stable
    # means used with real games on hardware; testing means it runs games
    # but has not been lived with. Enginehost offers each person the channel
    # they chose in Settings and every steadier one. The release logic lives
    # once, in Droidtop/enginehost (Droidtop/tracker#196).
    needs: sign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@bed4f8c3a300c5f8bc55dd4bd184e38ab9c7beda
    with:
      tooling-sha: bed4f8c3a300c5f8bc55dd4bd184e38ab9c7beda
      artifact-name: enginehost-tyrano-v1
      channel: ${{ inputs.channel }}
      tag: ${{ inputs.tag }}
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}

  unstable:
    # Every green push that produced a signed bundle is published as-is on
    # the unstable channel, replacing the previous one, so a person who opted
    # into unstable in Enginehost sees each build the moment CI is done with
    # it, and the build also gets its permanent history release. Branches
    # whose build makes no bundle publish nothing.
    needs: sign
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@bed4f8c3a300c5f8bc55dd4bd184e38ab9c7beda
    with:
      tooling-sha: bed4f8c3a300c5f8bc55dd4bd184e38ab9c7beda
      artifact-name: enginehost-tyrano-v1
      channel: unstable
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
